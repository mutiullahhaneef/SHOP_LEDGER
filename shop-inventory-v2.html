<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F6;--surface:#FFFFFF;--ink:#14282D;--muted:#61767B;--line:#DCE5E7;--side:#12343B;--side-ink:#E4F1F2;--side-mute:#8FB1B6;--accent:#0E7C86;--on-accent:#FFFFFF;--soft:#E2F1F2;--warn:#B45F00;--warn-bg:#FFF0D6;--bad:#B3402F;--bad-bg:#FBE3DE;--ok:#1F7A4F;--ok-bg:#DDF3E6;
color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1A1D;--surface:#15272B;--ink:#E6F1F2;--muted:#91AAAE;--line:#274147;--side:#0A1315;--side-mute:#7F9DA2;--accent:#4FC3CE;--on-accent:#0A1B1E;--soft:#1D3A3F;--warn:#F2B04A;--warn-bg:#3A2C12;--bad:#F09A8A;--bad-bg:#3D1E19;--ok:#6FD7A0;--ok-bg:#16352A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1A1D;--surface:#15272B;--ink:#E6F1F2;--muted:#91AAAE;--line:#274147;--side:#0A1315;--side-mute:#7F9DA2;--accent:#4FC3CE;--on-accent:#0A1B1E;--soft:#1D3A3F;--warn:#F2B04A;--warn-bg:#3A2C12;--bad:#F09A8A;--bad-bg:#3D1E19;--ok:#6FD7A0;--ok-bg:#16352A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-weight:800;font-size:1.2rem;padding:0 10px 12px}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:var(--side-ink);font:inherit;font-weight:700;padding:10px 12px;border-radius:10px;cursor:pointer}
.nav[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.grp{border-top:1px solid rgba(255,255,255,.15);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:7px}
.grp small{color:var(--side-mute);padding:0 4px}
.grp button,.grp select{font:inherit;font-weight:700;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:transparent;color:var(--side-ink);cursor:pointer}
.grp select option{color:#111}
.grp .load{background:var(--accent);color:var(--on-accent);border-color:transparent}
main{padding:26px 24px 80px;max-width:900px;width:100%}
h1{font-size:1.7rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
h2{font-size:1.05rem;font-weight:800;margin:0 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-size:1.5rem;font-weight:800}
.stat span{color:var(--muted);font-size:.9rem}
input,select,button{font:inherit;color:var(--ink)}
.f input,.f select,.search{background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;align-items:end}
.f label{font-weight:700;font-size:.85rem;display:block;margin-bottom:3px}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer}
.sec{background:var(--soft);color:var(--ink)}
.lnk{background:none;border:0;color:var(--accent);font-weight:800;cursor:pointer;padding:4px 6px}
.lnk.d{color:var(--bad)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:800;overflow-wrap:anywhere}
.row .m{color:var(--muted);font-size:.85rem}
.badge{font-size:.8rem;font-weight:800;border-radius:20px;padding:2px 10px;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)}.low{background:var(--warn-bg);color:var(--warn)}.out{background:var(--bad-bg);color:var(--bad)}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px}
.chart div{flex:1;text-align:center;font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;background:var(--accent);border-radius:6px 6px 0 0;min-height:3px}
.empty{text-align:center;color:var(--muted);padding:22px 8px;border:2px dashed var(--line);border-radius:14px}
.err{color:var(--bad);font-weight:700;margin-top:8px}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;max-width:92vw;z-index:5}
.toast button{background:none;border:0;font-weight:800;color:var(--accent);cursor:pointer}
[hidden]{display:none}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#receipt{position:absolute;left:0;top:0;width:100%;border:0}.noprint{display:none!important}}
@media (max-width:760px){
 .app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:12px;gap:6px;overflow:visible}
 .brand{width:100%;padding:0 4px 4px}
 .nav{width:auto;flex:1;text-align:center}
 .grp{width:100%;flex-direction:row;flex-wrap:wrap;margin-top:4px}
 .grp small{width:100%}.grp button,.grp select{flex:1}
 main{padding:18px 14px 80px}
}
</style>
</head>
<body>
<div class="app">
<aside>
 <div class="brand">Shop ledger</div>
 <button class="nav" data-v="dashboard">Dashboard</button>
 <button class="nav" data-v="products">Products</button>
 <button class="nav" data-v="sales">Sales</button>
 <div class="grp"><small>Export and backup</small>
  <button id="xp">Export products (CSV)</button>
  <button id="xs">Export sales (CSV)</button>
  <button id="bk">Back up data</button>
  <button id="rs">Restore backup</button>
  <input type="file" id="rf" accept=".json,application/json" hidden>
 </div>
 <div class="grp"><small>Demo and settings</small>
  <button class="load" id="load">Load sample data</button>
  <button id="clear">Clear all data</button>
  <select id="cur" aria-label="Currency"><option>Rs</option><option>$</option><option>€</option><option>£</option></select>
 </div>
</aside>
<main id="view"></main>
</div>
<div class="toast" id="toast" hidden><span id="tmsg"></span><button id="undo" hidden>Undo</button></div>
<script>
var KEY="shop-ledger-v2",D={products:[],orders:[],cur:"Rs"},view="dashboard",editId=null,q="",prev=null,tt=null,err="",cart=[],rid=null;
var $=function(i){return document.getElementById(i)};
try{var l=JSON.parse(localStorage.getItem(KEY));if(l)D=l;else{var o=JSON.parse(localStorage.getItem("shop-ledger-v1"));
 if(o)D={cur:o.cur||"Rs",products:o.products.map(function(p){p.cost=p.cost||0;return p}),orders:(o.sales||[]).map(function(s){return{id:s.id,ts:s.ts,items:[{pid:s.pid,name:s.name,qty:s.qty,price:s.price,cost:0}]}})}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function money(v){return D.cur+" "+Number(v).toLocaleString(undefined,{maximumFractionDigits:2})}
function uid(){return Date.now()+Math.floor(Math.random()*1e6)}
function dkey(t){var d=new Date(t);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function toast(m,u){$("tmsg").textContent=m;$("undo").hidden=!u;$("toast").hidden=false;clearTimeout(tt);tt=setTimeout(function(){$("toast").hidden=true;prev=null},6000)}
function status(p){return p.stock<=0?["out","Out of stock"]:p.stock<=p.min?["low","Low: "+p.stock+" left"]:["ok",p.stock+" in stock"]}
function findP(id){return D.products.find(function(p){return p.id===id})}
function sum(o,f){return o.items.reduce(function(a,i){return a+f(i)},0)}
function tot(o){return sum(o,function(i){return i.qty*i.price})}
function prof(o){return sum(o,function(i){return i.qty*(i.price-i.cost)})}
function nqty(o){return sum(o,function(i){return i.qty})}
function fdate(t){return new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}

/* ---------- Views ---------- */
function render(){
 document.querySelectorAll(".nav").forEach(function(b){b.setAttribute("aria-current",b.dataset.v===view?"page":"false")});
 $("cur").value=D.cur;({dashboard:vDash,products:vProd,sales:vSales})[view]();
 try{history.replaceState(null,"","#"+view)}catch(e){}
}
function orderRow(o){return'<div class="row"><div class="main"><div class="t">'+o.items.map(function(i){return esc(i.name)+' × '+i.qty}).join(", ")+'</div><div class="m">'+fdate(o.ts)+' · profit '+money(prof(o))+'</div></div><b>'+money(tot(o))+'</b>'+(view==="sales"?'<button class="lnk" data-r="'+o.id+'">Receipt</button><button class="lnk d" data-v="'+o.id+'">Void</button>':'')+'</div>'}
function vDash(){
 var tk=dkey(Date.now()),ts=D.orders.filter(function(o){return dkey(o.ts)===tk}),rev=0,pf=0,it=0;
 ts.forEach(function(o){rev+=tot(o);pf+=prof(o);it+=nqty(o)});
 var low=D.products.filter(function(p){return p.stock<=p.min}),days=[],mx=1;
 for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=dkey(d),t=0;D.orders.forEach(function(o){if(dkey(o.ts)===k)t+=tot(o)});days.push({l:d.toLocaleDateString(undefined,{weekday:"short"}),v:t});mx=Math.max(mx,t)}
 $("view").innerHTML='<h1>Dashboard</h1><p class="sub">How your shop is doing today.</p>'+
 '<div class="stats"><div class="stat"><b>'+money(rev)+'</b><span>Sales today</span></div><div class="stat"><b>'+money(pf)+'</b><span>Profit today</span></div><div class="stat"><b>'+it+'</b><span>Items sold today</span></div><div class="stat"><b>'+low.length+'</b><span>Need restocking</span></div></div>'+
 (D.products.length?'':'<div class="empty">Your shop is empty. Add products on the Products page, or choose Load sample data in the side panel to see a demo.</div>')+
 (D.orders.length?'<div class="card"><h2>Sales, last 7 days</h2><div class="chart">'+days.map(function(d){return'<div title="'+money(d.v)+'"><i style="height:'+Math.round(d.v/mx*90)+'px"></i>'+d.l+'</div>'}).join("")+'</div></div>':'')+
 (low.length?'<div class="card"><h2>Low stock alerts</h2>'+low.map(function(p){var s=status(p);return'<div class="row"><div class="main"><div class="t">'+esc(p.name)+'</div><div class="m">'+esc(p.cat)+'</div></div><span class="badge '+s[0]+'">'+s[1]+'</span></div>'}).join("")+'</div>':'')+
 (D.orders.length?'<div class="card"><h2>Latest sales</h2>'+D.orders.slice(0,5).map(orderRow).join("")+'</div>':'');
}
function vProd(){
 var e=editId?findP(editId):null;
 $("view").innerHTML='<h1>Products</h1><p class="sub">Add, edit and remove what you sell.</p>'+
 '<div class="card"><h2>'+(e?'Edit product':'Add a product')+'</h2><div class="f">'+
 '<div><label for="pn">Name</label><input id="pn" maxlength="50" value="'+(e?esc(e.name):"")+'"></div>'+
 '<div><label for="pc">Category</label><input id="pc" maxlength="30" value="'+(e?esc(e.cat):"")+'"></div>'+
 '<div><label for="pp">Selling price</label><input id="pp" type="number" min="0" step="0.01" value="'+(e?e.price:"")+'"></div>'+
 '<div><label for="pk">Cost price</label><input id="pk" type="number" min="0" step="0.01" value="'+(e?e.cost:"")+'"></div>'+
 '<div><label for="ps">Stock</label><input id="ps" type="number" min="0" step="1" value="'+(e?e.stock:"")+'"></div>'+
 '<div><label for="pm">Warn me at</label><input id="pm" type="number" min="0" step="1" value="'+(e?e.min:5)+'"></div>'+
 '<div style="display:flex;gap:8px"><button class="btn" id="psave">'+(e?'Save changes':'Add product')+'</button>'+(e?'<button class="btn sec" id="pcancel">Cancel</button>':'')+'</div></div><div class="err" id="perr"></div></div>'+
 '<input class="search" id="search" placeholder="Search products" aria-label="Search products" value="'+esc(q)+'" style="margin-bottom:12px"><div class="card" id="plist"></div>';
 $("psave").onclick=saveProd;if($("pcancel"))$("pcancel").onclick=function(){editId=null;render()};
 $("search").oninput=function(){q=this.value;drawList()};drawList();
}
function drawList(){
 var l=D.products.filter(function(p){return(p.name+" "+p.cat).toLowerCase().indexOf(q.toLowerCase())>-1});
 $("plist").innerHTML=l.length?l.map(function(p){var s=status(p),mg=p.price>0?Math.round((p.price-p.cost)/p.price*100):0;return'<div class="row"><div class="main"><div class="t">'+esc(p.name)+'</div><div class="m">'+esc(p.cat)+' · sells '+money(p.price)+' · cost '+money(p.cost)+' · margin '+mg+'%</div></div><span class="badge '+s[0]+'">'+s[1]+'</span><button class="lnk" data-e="'+p.id+'">Edit</button><button class="lnk d" data-d="'+p.id+'">Delete</button></div>'}).join(""):'<div class="empty">'+(D.products.length?'No products match your search.':'No products yet. Fill in the form above to add one.')+'</div>';
}
function saveProd(){
 var n=$("pn").value.trim(),pr=parseFloat($("pp").value),ck=parseFloat($("pk").value),st=parseInt($("ps").value,10),mn=parseInt($("pm").value,10);
 if(!n||isNaN(pr)||pr<0||isNaN(st)||st<0){$("perr").textContent="Enter a name, a selling price and a stock number of 0 or more.";return}
 var o={name:n,cat:$("pc").value.trim()||"General",price:pr,cost:isNaN(ck)?0:ck,stock:st,min:isNaN(mn)?5:mn};
 if(editId){Object.assign(findP(editId),o);editId=null;toast("Product saved.")}else{o.id=uid();D.products.push(o);toast("Product added.")}
 save();render();
}
function receipt(o){
 return'<div class="card" id="receipt"><h2>Shop ledger</h2><div class="m">'+fdate(o.ts)+' · Sale #'+String(o.id).slice(-5)+'</div>'+
 o.items.map(function(i){return'<div class="row"><div class="main">'+esc(i.name)+'<div class="m">'+i.qty+' × '+money(i.price)+'</div></div><b>'+money(i.qty*i.price)+'</b></div>'}).join("")+
 '<div class="tot"><span>Total</span><span>'+money(tot(o))+'</span></div><div class="m">Thank you for shopping with us.</div>'+
 '<div class="noprint" style="display:flex;gap:8px;margin-top:12px"><button class="btn" id="prt">Print receipt</button><button class="btn sec" id="cls">Close</button></div></div>';
}
function vSales(){
 var av=D.products.filter(function(p){return p.stock>0}),ro=rid&&D.orders.find(function(o){return o.id===rid}),ct=0,cp=0,h='<h1>Sales</h1><p class="sub">Add one or more products to a sale, then complete it.</p>';
 if(ro)h+=receipt(ro);
 h+='<div class="card noprint"><h2>New sale</h2>'+(av.length?'<div class="f"><div style="grid-column:span 2"><label for="sp">Product</label><select id="sp">'+av.map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+' ('+p.stock+' left, '+money(p.price)+')</option>'}).join("")+'</select></div><div><label for="sq">Quantity</label><input id="sq" type="number" min="1" step="1" value="1"></div><div><button class="btn sec" id="addc" style="width:100%">Add to sale</button></div></div>':'<div class="empty">No products in stock. Add or restock products on the Products page.</div>')+'<div class="err" id="serr">'+esc(err)+'</div>';
 if(cart.length){h+='<div style="margin-top:12px">'+cart.map(function(c){var p=findP(c.pid);ct+=p.price*c.qty;cp+=(p.price-p.cost)*c.qty;return'<div class="row"><div class="main"><div class="t">'+esc(p.name)+' × '+c.qty+'</div></div><b>'+money(p.price*c.qty)+'</b><button class="lnk d" data-rc="'+c.pid+'">Remove</button></div>'}).join("")+'<div class="tot"><span>Total</span><span>'+money(ct)+'</span></div><div class="m">Estimated profit '+money(cp)+'</div><button class="btn" id="done" style="margin-top:10px">Complete sale</button></div>'}
 h+='</div><div class="card noprint"><h2>Sales log</h2>'+(D.orders.length?D.orders.slice(0,60).map(orderRow).join(""):'<div class="empty">No sales yet. Add products to a sale above and complete it.</div>')+'</div>';
 $("view").innerHTML=h;
 if($("prt"))$("prt").onclick=function(){try{window.print()}catch(e){toast("Printing is not available here.")}};
 if($("cls"))$("cls").onclick=function(){rid=null;render()};
 if($("addc"))$("addc").onclick=function(){
  var p=findP(+$("sp").value),n=parseInt($("sq").value,10),c=cart.find(function(x){return x.pid===p.id}),have=c?c.qty:0;
  if(isNaN(n)||n<1){err="Enter a quantity of 1 or more.";return vSales()}
  if(n+have>p.stock){err="Only "+p.stock+" of "+p.name+" in stock.";return vSales()}
  err="";if(c)c.qty+=n;else cart.push({pid:p.id,qty:n});vSales();
 };
 if($("done"))$("done").onclick=function(){
  for(var i=0;i<cart.length;i++){var p=findP(cart[i].pid);if(!p||cart[i].qty>p.stock){err="Stock changed. Remove "+(p?p.name:"an item")+" and try again.";return vSales()}}
  var o={id:uid(),ts:Date.now(),items:cart.map(function(c){var p=findP(c.pid);p.stock-=c.qty;return{pid:p.id,name:p.name,qty:c.qty,price:p.price,cost:p.cost}})};
  D.orders.unshift(o);cart=[];err="";rid=o.id;save();render();toast("Sale completed: "+money(tot(o))+".");
 };
}

/* ---------- Files ---------- */
async function saveFile(name,text){
 try{var dl=window.claude&&claude.use?await claude.use("downloads"):null;
  if(dl){await dl.save({filename:name,data:text});toast("Saved "+name+".");return}}
 catch(e){if(e&&e.code==="declined")return}
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"text/plain"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Downloaded "+name+".");
}
function csv(rows){return rows.map(function(r){return r.map(function(c){return'"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n")}
function today(){return dkey(Date.now()).replace(/-(\d)(?=-|$)/g,"-0$1")}
$("xp").onclick=function(){if(!D.products.length)return toast("No products to export yet.");saveFile("products-"+today()+".csv",csv([["Name","Category","Selling price","Cost price","Stock","Warn at"]].concat(D.products.map(function(p){return[p.name,p.cat,p.price,p.cost,p.stock,p.min]}))))};
$("xs").onclick=function(){if(!D.orders.length)return toast("No sales to export yet.");var r=[["Date","Sale","Product","Qty","Price","Cost","Revenue","Profit"]];
 D.orders.forEach(function(o){o.items.forEach(function(i){r.push([new Date(o.ts).toISOString().slice(0,16).replace("T"," "),String(o.id).slice(-5),i.name,i.qty,i.price,i.cost,i.qty*i.price,i.qty*(i.price-i.cost)])})});saveFile("sales-"+today()+".csv",csv(r))};
$("bk").onclick=function(){saveFile("shop-backup-"+today()+".json",JSON.stringify(D,null,1))};
$("rs").onclick=function(){$("rf").click()};
$("rf").onchange=function(){
 var f=this.files[0],inp=this;if(!f)return;var fr=new FileReader();
 fr.onload=function(){try{var d=JSON.parse(fr.result);if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw 0;
  prev={t:"all",d:JSON.parse(JSON.stringify(D))};D={products:d.products,orders:d.orders,cur:d.cur||"Rs"};cart=[];rid=null;save();render();toast("Backup restored.",true)}
  catch(e){toast("That file is not a Shop ledger backup.")}inp.value=""};
 fr.readAsText(f);
};

/* ---------- Actions ---------- */
document.querySelector("aside").onclick=function(e){var b=e.target.closest(".nav");if(b){view=b.dataset.v;render()}};
$("view").onclick=function(e){
 var b=e.target.closest("button");if(!b)return;
 if(b.dataset.e){editId=+b.dataset.e;render();window.scrollTo(0,0)}
 else if(b.dataset.d){var i=D.products.findIndex(function(p){return p.id===+b.dataset.d});prev={t:"p",i:i,p:D.products[i]};D.products.splice(i,1);cart=cart.filter(function(c){return c.pid!==prev.p.id});save();drawList();toast("Product deleted.",true)}
 else if(b.dataset.rc){cart=cart.filter(function(c){return c.pid!==+b.dataset.rc});vSales()}
 else if(b.dataset.r){rid=+b.dataset.r;render();window.scrollTo(0,0)}
 else if(b.dataset.v){var j=D.orders.findIndex(function(o){return o.id===+b.dataset.v}),o=D.orders[j];
  o.items.forEach(function(it){var p=findP(it.pid);if(p)p.stock+=it.qty});prev={t:"o",i:j,o:o};D.orders.splice(j,1);if(rid===o.id)rid=null;save();render();toast("Sale voided. Stock restored.",true)}

 if(prev){

 prev={t:"all",d:JSON.parse(JSON.stringify(D))};cart=[];rid=null;

 D.orders.sort(function(a,b){return b.ts-a.ts});save();view="dashboard";render();toast("Sample data loaded.",true);
